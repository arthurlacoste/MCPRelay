<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Real-time calls</title>
  <link rel="icon" type="image/svg+xml" href="/rt/assets/gate.svg">
  <link rel="stylesheet" href="/rt/assets/trajectory.css?v=__ASSET_VERSION__">
  <link rel="stylesheet" href="/rt/assets/command-guard.css?v=__ASSET_VERSION__">
</head>
<body>
  <aside class="sidebar">
    <button class="brand" id="all-calls" aria-label="Show all calls" title="All calls">
      <img src="/rt/assets/gate.svg" alt=""><span>gate</span>
    </button>
    <nav class="primary-nav" aria-label="Gate views">
      <button class="nav-item active" id="nav-realtime" data-view="realtime" aria-current="page" title="Real-time calls">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3 12h4l2-6 4 12 2-6h6"/></svg><span>Real-time calls</span>
      </button>
      <button class="nav-item" id="nav-command-guard" data-view="command-guard" title="Commande guard">
        <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 3 20 6v5c0 5-3.2 8.3-8 10-4.8-1.7-8-5-8-10V6z"/><path d="m9 12 2 2 4-5"/></svg><span>Commande guard</span>
      </button>
    </nav>
    <button class="session" id="refresh" title="Refresh">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M21 12a9 9 0 1 1-2.64-6.36L21 8"/><path d="M21 3v5h-5"/></svg><span>Refresh</span>
    </button>
    <button class="rail-action" id="mobile-buckets" aria-label="Conversations" aria-expanded="false" aria-controls="conversation-drawer" title="Conversations">
      <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M3.5 6.5h6l2 2h9v10h-17z"/></svg>
    </button>
    <button class="rail-action" id="mobile-search" aria-label="Search calls" title="Search calls">
      <svg viewBox="0 0 24 24" aria-hidden="true"><circle cx="10.5" cy="10.5" r="6.5"/><path d="m15.5 15.5 5 5"/></svg>
    </button>
    <div class="conversation-drawer" id="conversation-drawer">
      <div class="drawer-head"><span>Conversations</span><button id="close-conversations" aria-label="Close conversations">×</button></div>
      <nav id="conversations" aria-label="Conversation filter"></nav>
    </div>
  </aside>
  <main class="app">
    <section class="app-view active" id="view-realtime">
      <header class="header">
        <div class="view-title">Real-time calls</div>
      </header>
      <div class="toolbar">
        <div class="modes" role="group" aria-label="Timeline projection">
          <button id="duration" class="pressed" aria-pressed="true"><svg class="mode-icon" viewBox="0 0 18 18" aria-hidden="true"><circle cx="9" cy="9" r="6.2"/><path d="M9 5.3V9l2.7 1.6"/></svg><span>Duration</span></button>
          <button id="turns" aria-pressed="false"><svg class="mode-icon" viewBox="0 0 18 18" aria-hidden="true"><rect x="3" y="3" width="12" height="12" rx="1"/><path d="M7 3v12M11 3v12"/></svg><span>Turn</span></button>
          <button id="calls-toggle" aria-pressed="false"><svg class="mode-icon" viewBox="0 0 18 18" aria-hidden="true"><rect x="3" y="4" width="8" height="8" rx="1"/><path d="M7 7h8v8H7z"/></svg><span>Call</span></button>
          <button id="state-toggle" aria-pressed="false"><svg class="mode-icon" viewBox="0 0 18 18" aria-hidden="true"><path d="M4 3h10v12H4zM7 3v12"/></svg><span>State</span></button>
          <button id="thinking-toggle" class="pressed" aria-pressed="true"><svg class="mode-icon sparkle" viewBox="0 0 18 18" aria-hidden="true"><path d="M9 2.5c.7 3.7 2 5 5.5 6.5-3.5 1.5-4.8 2.8-5.5 6.5C8.3 11.8 7 10.5 3.5 9 7 7.5 8.3 6.2 9 2.5Z"/></svg><span>Thinking</span></button>
        </div>
        <label class="search">
          <svg class="search-icon" viewBox="0 0 20 20" aria-hidden="true"><circle cx="8.5" cy="8.5" r="5.5"/><path d="m12.5 12.5 4 4"/></svg>
          <input id="search" type="search" placeholder="Search">
        </label>
      </div>
      <section class="timeline" aria-label="Trajectory timeline">
        <div class="lane-labels"><span>Input</span><span>Model</span><span>Tools</span></div>
        <div class="track" id="track"><div id="spans"></div></div>
      </section>
      <div class="split" id="split">
        <div class="ledger-shell">
          <section class="ledger" id="ledger" aria-live="polite"></section>
          <button class="scroll-bottom" id="scroll-bottom" aria-label="Go to latest calls" title="Go to latest calls" hidden>
            <svg viewBox="0 0 18 18" aria-hidden="true"><path d="m4 7 5 5 5-5"/></svg>
          </button>
        </div>
        <aside class="inspector" id="inspector" hidden>
          <div class="inspector-head">
            <span class="badge" id="detail-kind">TOOL</span>
            <span id="detail-location"></span><button id="close">×</button>
          </div>
          <div class="detail-tabs" role="tablist">
            <button class="active" data-tab="summary">Summary</button>
            <button data-tab="payload">Payload</button>
            <button data-tab="result">Result</button>
            <button data-tab="timing">Timing</button>
          </div>
          <div class="detail-body" id="detail-body"></div>
        </aside>
      </div>
    </section>

    <section class="app-view command-guard-view" id="view-command-guard" hidden>
      <header class="header"><div class="view-title">Commande guard</div></header>
      <div class="guard-scroll">
        <div class="guard-content">
          <div class="guard-banner warning" id="guard-disabled" hidden>Command guard disabled for this launch</div>
          <section class="guard-summary" aria-label="Command guard status">
            <div><span>Provider</span><strong id="guard-provider">…</strong></div>
            <div><span>Fallback</span><strong id="guard-fallback">…</strong></div>
            <div><span>Gate rules</span><strong id="guard-builtin-count">0</strong></div>
            <div><span>Custom rules</span><strong id="guard-custom-count">0</strong></div>
          </section>

          <section class="guard-section">
            <div class="guard-section-head"><div><h2>Règles Gate</h2><p>Built-in protections. Read-only.</p></div></div>
            <div class="guard-list" id="builtin-rules"><p class="guard-empty">Loading…</p></div>
          </section>

          <section class="guard-section">
            <div class="guard-section-head">
              <div><h2>Règles personnalisées</h2><p>Additional deny-only protections.</p></div>
              <button class="primary-button" id="add-custom-guard">+ Add custom guard</button>
            </div>
            <form class="guard-form" id="guard-form" hidden novalidate>
              <input type="hidden" id="guard-editing-id">
              <div class="guard-form-grid">
                <label>Name<input id="guard-label" maxlength="100" required></label>
                <label>ID<input id="guard-id" maxlength="64" pattern="[a-z0-9][a-z0-9._-]{0,63}" required></label>
                <label>Match type<select id="guard-match-type"><option value="contains">Contains</option><option value="glob">Glob</option></select></label>
                <label class="wide">Pattern<input id="guard-pattern" maxlength="500" required></label>
                <label class="wide">Reason<textarea id="guard-reason" maxlength="500" rows="2" required></textarea></label>
                <label class="wide">Remediation<textarea id="guard-remediation" maxlength="500" rows="2"></textarea></label>
                <label class="wide">Safe commands<textarea id="guard-commands" rows="3" placeholder="One command per line"></textarea></label>
                <label class="check"><input type="checkbox" id="guard-enabled" checked>Enabled</label>
                <label class="wide">Test command<input id="guard-test-command" maxlength="20000" placeholder="Command to inspect, never executed"></label>
              </div>
              <div class="guard-form-error" id="guard-form-error" hidden></div>
              <div class="guard-test-result" id="guard-test-result" hidden></div>
              <div class="guard-form-actions">
                <button type="button" id="cancel-custom-guard">Cancel</button>
                <button type="button" id="test-custom-guard">Test</button>
                <button class="primary-button" type="submit">Save</button>
              </div>
            </form>
            <div class="guard-list" id="custom-rules"><p class="guard-empty">Loading…</p></div>
          </section>
        </div>
      </div>
    </section>
  </main>
  <script src="/rt/assets/trajectory.js?v=__ASSET_VERSION__"></script>
  <script src="/rt/assets/command-guard.js?v=__ASSET_VERSION__"></script>
</body>
</html>
