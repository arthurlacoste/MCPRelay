name: Pull request structure

on:
  pull_request:
    types: [opened, edited, reopened, synchronize, ready_for_review]

permissions:
  contents: read

jobs:
  validate:
    if: >-
      ${{ !contains(github.event.pull_request.labels.*.name, 'autorelease: pending') &&
          !startsWith(github.head_ref, 'release-please--branches--') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Save pull request body
        env:
          PR_BODY: ${{ github.event.pull_request.body }}
        run: printf '%s' "$PR_BODY" > "$RUNNER_TEMP/pr-body.md"
      - name: Validate pull request body
        run: python3 scripts/validate_pr_body.py "$RUNNER_TEMP/pr-body.md"
