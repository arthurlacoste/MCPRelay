name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    name: Python tests
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip

      - name: Install dependencies
        run: python -m pip install -r requirements.txt

      - name: Run tests
        run: pytest -q

      - name: Check whitespace errors
        run: git diff --check

  dedup:
    name: Duplicate code
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Detect duplicate code
        run: npm run dedup

  alpine-installer:
    name: Alpine installer
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install Node through Alpine path
        run: |
          docker run --rm -v "$PWD:/work" -w /work alpine:3.22 sh -c '
            apk add --no-cache bash >/dev/null &&
            GATE_INSTALLER_LIB_ONLY=true bash -c "source ./install.sh; install_node; test \"\$(node_major_version)\" -ge 22"
          '
